apiVersion: apps/v1
kind: Deployment

metadata:
  name: patient-service

spec:
  replicas: {{ .Values.patient.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: patient

  template:
    metadata:
      labels:
        app: patient

    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: patient
              topologyKey: kubernetes.io/hostname

      containers:
        - name: patient
          image: "{{ .Values.patient.image.repository }}:{{ .Values.patient.image.tag }}"
          imagePullPolicy: {{ .Values.patient.image.pullPolicy }}

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hmis-secret
                  key: MONGO_INITDB_ROOT_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hmis-secret
                  key: MONGO_INITDB_ROOT_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
